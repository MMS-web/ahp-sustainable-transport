<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محاكاة عملية التحليل الهرمي (AHP): النقل المستدام</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--sap:#72B0AB;--arc:#BCDDDC;--lace:#FFEDD1;--bub:#FDC1B4;--bal:#FE9179;--bg:#FFF6E6;--card:#FFFFFF;--ink:#1F4A47;--mut:#4F7471;--line:#BCDDDC;--tint:#EEF7F6;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10211f;--card:#18302d;--ink:#FFEDD1;--mut:#BCDDDC;--line:#2e5551;--tint:#1e3b38}}
:root[data-theme="dark"]{--bg:#10211f;--card:#18302d;--ink:#FFEDD1;--mut:#BCDDDC;--line:#2e5551;--tint:#1e3b38}
*{box-sizing:border-box}html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',Tahoma,Arial,sans-serif;line-height:1.85;padding-bottom:40px}
header{background:linear-gradient(135deg,var(--sap),var(--arc) 65%,var(--lace));color:#16403d;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.12);padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 14px;text-align:center}header p{margin:0;background:var(--bal);color:#fff;border-radius:99px;padding:0 12px;font-weight:700;font-size:13px}
header .c{display:inline-block;background:var(--bal);color:#fff;border-radius:99px;padding:0 12px;font-weight:700;font-size:13px}
header h1{margin:0;font-size:clamp(15px,2.4vw,19px);font-weight:800}header h1 small{font-size:1em;font-weight:800;direction:ltr;unicode-bidi:isolate;margin-inline-start:8px}
main{max-width:880px;margin:6px auto 30px;padding:0 14px}
.prog{display:flex;gap:6px;position:sticky;top:var(--hh,56px);z-index:9;background:var(--bg);padding:8px 0;margin-bottom:6px}.prog i{flex:1;height:8px;border-radius:8px;background:var(--arc);opacity:.6}.prog i.on{background:var(--bal);opacity:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 8px 28px rgba(114,176,171,.25)}
h2{margin:6px 0;font-size:22px;color:var(--ink)}h3{margin:16px 0 4px;color:var(--ink)}p{margin:.4em 0}
.tag{display:inline-block;background:var(--sap);color:#fff;border-radius:99px;padding:0 12px;font-size:13px;font-weight:700}
.en{direction:ltr;unicode-bidi:isolate;font-weight:500}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin:12px 0}
.box{border-radius:16px;padding:12px 14px;background:var(--tint);border:1px solid var(--line)}.box b{display:block;color:var(--ink)}.box.one b{display:inline}
.box.w{background:var(--lace);color:#5b3a24}.box.p{background:var(--bub);color:#5b2a1c}.box.a{background:var(--arc);color:#16403d}
.k{color:#A8321A;font-weight:800;font-size:1.1em}.th{display:block;white-space:nowrap;margin-top:2px;font-weight:700}
.tree{overflow-x:auto}.tree svg{min-width:560px;width:100%;height:auto}
.pair{display:grid;grid-template-columns:130px 1fr 130px;gap:10px;align-items:center;margin-top:16px}
.pair .l{font-weight:700;text-align:center;border-radius:12px;padding:6px;background:var(--lace);color:#5b3a24;font-size:14px}
input[type=range]{width:100%;accent-color:var(--bal);direction:rtl}
.say{text-align:center;color:var(--mut);font-size:15px;min-height:26px}.say b{color:#c2553a}
.btns{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:20px}
button{font-family:inherit;font-size:16px;font-weight:700;border:0;border-radius:14px;padding:10px 22px;cursor:pointer;background:var(--bal);color:#fff}
button.g{background:transparent;color:var(--ink);border:2px solid var(--sap)}button:disabled{opacity:.4;cursor:default}
.hint{background:var(--lace);color:#5b3a24;border-right:6px solid var(--bal);border-radius:12px;padding:10px 14px;margin:14px 0;font-size:15px}
.bar{display:grid;grid-template-columns:150px 1fr 52px;gap:8px;align-items:center;margin:8px 0;font-size:15px}
.bar .t{background:var(--arc);border-radius:99px;height:18px;overflow:hidden}.bar .t span{display:block;height:100%;background:linear-gradient(90deg,var(--sap),var(--bal));border-radius:99px;transition:width .6s}
.win{font-size:20px;text-align:center;background:var(--sap);color:#fff;border-radius:16px;padding:14px;margin:12px 0;font-weight:700}
.cr{border-radius:12px;padding:10px 14px;font-weight:700;margin:8px 0}.ok{background:var(--arc);color:#16403d}.no{background:var(--bub);color:#7a2410}
.f{direction:ltr;text-align:center;background:var(--tint);border:1px dashed var(--sap);border-radius:12px;padding:8px;margin:8px 0;font-family:Georgia,'Times New Roman',serif;font-size:17px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;text-align:center}td,th{border:1px solid var(--line);padding:5px}th{background:var(--arc);color:#16403d}
ul.ref{padding:0 0 0 20px;direction:ltr;text-align:left}ul.ref li{margin-bottom:8px}a{color:#c2553a;word-break:break-word}
.fix{position:fixed;bottom:0;left:0;right:0;z-index:9;background:var(--sap);color:#fff;text-align:center;font-weight:700;font-size:13px;padding:4px 10px calc(4px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.12);line-height:1.4}
@media(max-width:560px){.pair{grid-template-columns:1fr 1fr}.pair input{grid-column:1/3;grid-row:2}.bar{grid-template-columns:100px 1fr 46px}}
</style>
</head>
<body>
<header><span class="c">مقرر صنع السياسات البيئية</span><h1>عملية التحليل الهرمي (AHP)<small>Analytic Hierarchy Process</small></h1><p>محاكاة تفاعلية: كيف نختار نظام النقل المستدام لمدينتنا؟</p></header>
<main><div class="prog" id="prog"></div><div class="card" id="view"></div></main>
<div class="fix">د. مها محمود الصباغ - جامعة الخليج العربي</div>
<script>
const C=["البيئي: خفض انبعاثات CO₂","الاقتصادي: التكلفة","الاجتماعي: إتاحة الوصول"],A=["حافلات كهربائية (BRT)","مترو خفيف (LRT)"];
const P3=[[0,1],[0,2],[1,2]],P2=[[0,1]],NM={1:"متساوية",2:"بين المتساوية والمتوسطة",3:"متوسطة",4:"بين المتوسطة والقوية",5:"قوية",6:"بين القوية والقوية جدًا",7:"قوية جدًا",8:"بين القوية جدًا والمطلقة",9:"مطلقة"};
const RI={1:0,2:0,3:.58};const D={c:[1,2,1],a:[[-2],[4],[1]]};
let S={c:[...D.c],a:D.a.map(x=>[...x])},step=0;const STEPS=8;
function calc(v,n,P){const m=Array.from({length:n},()=>Array(n).fill(1));P.forEach(([i,j],k)=>{const s=Math.abs(v[k])+1,a=v[k]>=0?s:1/s;m[i][j]=a;m[j][i]=1/a});
const cs=m[0].map((_,j)=>m.reduce((t,r)=>t+r[j],0));const w=m.map(r=>r.reduce((t,x,j)=>t+x/cs[j],0)/n);
const lam=m.map((r,i)=>r.reduce((t,x,j)=>t+x*w[j],0)/w[i]).reduce((a,b)=>a+b)/n;const ci=(lam-n)/(n-1),cr=RI[n]?ci/RI[n]:0;return{w,lam,ci,cr}}
const say=(v,N,i,j)=>v==0?"الطرفان <b>متساويان</b> في الأهمية":`<b>${N[v>0?i:j]}</b> أهم بدرجة ${Math.abs(v)+1} (${NM[Math.abs(v)+1]})`;
function pairs(vals,N,P,key,idx){return P.map(([i,j],k)=>`<div class="pair"><div class="l">${N[i]}</div><input type="range" min="-8" max="8" value="${vals[k]}" oninput="upd('${key}',${idx},${k},this.value)"><div class="l">${N[j]}</div></div><div class="say" id="sy${k}">${say(vals[k],N,i,j)}</div>`).join("")}
function upd(key,idx,k,val){val=+val;const N=key=='c'?C:A,P=key=='c'?P3:P2;if(key=='c')S.c[k]=val;else S.a[idx][k]=val;document.getElementById('sy'+k).innerHTML=say(val,N,P[k][0],P[k][1]);live()}
function live(){const el=document.getElementById('live');if(!el)return;const r=calc(S.c,3,P3);el.className='cr '+(r.cr<=.1?'ok':'no');el.innerHTML=r.cr<=.1?`نسبة الاتساق CR = ${r.cr.toFixed(3)} ✔ أحكامك متسقة`:`نسبة الاتساق CR = ${r.cr.toFixed(3)} ✘ أحكامك متناقضة، راجعها!`}
const tree=`<div class="tree"><svg viewBox="0 0 640 250" font-family="Tajawal,Tahoma" text-anchor="middle"><g stroke="#72B0AB" stroke-width="2" fill="none">${[110,320,530].map(x=>`<path d="M320 52 L${x} 105"/>`).join("")}${[110,320,530].map(x=>[185,455].map(y=>`<path d="M${x} 145 L${y} 200" opacity=".5"/>`).join("")).join("")}</g>
<rect x="170" y="12" width="300" height="40" rx="20" fill="#72B0AB"/><text x="320" y="38" fill="#fff" font-size="16" font-weight="700">الهدف: اختيار نظام نقل مستدام</text>
${C.map((c,i)=>`<rect x="${[110,320,530][i]-100}" y="105" width="200" height="40" rx="20" fill="#BCDDDC"/><text x="${[110,320,530][i]}" y="131" fill="#16403d" font-size="14" font-weight="700">${c}</text>`).join("")}
${A.map((c,i)=>`<rect x="${[185,455][i]-100}" y="200" width="200" height="38" rx="19" fill="#FE9179"/><text x="${[185,455][i]}" y="225" fill="#fff" font-size="14" font-weight="700">${c}</text>`).join("")}</svg></div>`;
const nav=(b,lbl)=>`<div class="btns"><button class="g" ${b?`onclick="go(${step-1})"`:"disabled"}>→ السابق</button><button onclick="go(${step+1})">${lbl||"التالي ←"}</button></div>`;
const tg=n=>`<span class="tag">الخطوة ${n} من ${STEPS}</span>`;
function cmp(key,idx,N,P,title,q,extra){return`${tg(step+1)}<h2>${title}</h2><p>${q}</p>${extra||""}<div class="hint">💡 حرّك المؤشر نحو العنصر الذي تراه أهم؛ فكلما ابتعدت عن المنتصف زادت درجة الأفضلية (من 1 إلى 9 وفق مقياس ساعاتي).</div>${pairs(key=='c'?S.c:S.a[idx],N,P,key,idx)}${key=='c'?'<div id="live"></div>':'<div class="hint">ملاحظة: مع بديلين فقط تكون المصفوفة 2×2 متسقة دائمًا، فلا حاجة لفحص CR هنا.</div>'}${nav(1)}`}
const scale=`<table><tr><th>الدرجة</th><th>المعنى (مقياس ساعاتي)</th></tr><tr><td>1</td><td>أهمية متساوية</td></tr><tr><td>3</td><td>أهمية متوسطة لأحد العنصرين</td></tr><tr><td>5</td><td>أهمية قوية</td></tr><tr><td>7</td><td>أهمية قوية جدًا</td></tr><tr><td>9</td><td>أهمية مطلقة</td></tr><tr><td>2، 4، 6، 8</td><td>قيم وسطية بين الدرجات</td></tr></table>`;
function render(){const v=document.getElementById('view');let h="";
if(step==0)h=`${tg(1)}<h2>مفهوم التحليل متعدد المعايير ونبذة عن AHP</h2>
<div class="box a one"><b>🧩 التحليل متعدد المعايير (Multi-Criteria Analysis – MCA):</b> أسلوب لدعم القرار يقيّم عدة بدائل وفق معايير متعددة، وغالبًا متعارضة (بيئية واقتصادية واجتماعية)، بدلًا من الاعتماد على معيار واحد مثل التكلفة. وهو مفيد في السياسات البيئية لأن القرارات فيها توازن بين مصالح متعددة.</div>
<div class="box p one" style="margin-top:10px"><b>🧭 عملية التحليل الهرمي (Analytic Hierarchy Process – AHP):</b> إحدى أشهر طرق التحليل متعدد المعايير، طوّرها <b>توماس ساعاتي (Thomas Saaty)</b> في سبعينيات القرن الماضي. تفكّك هذه الطريقة المشكلة إلى هرم من ثلاثة مستويات (الهدف ثم المعايير ثم البدائل)، وتحوّل أحكام صانع القرار إلى أرقام عبر المقارنات الثنائية، ثم تحسب أوزان المعايير وترتّب البدائل، وتتحقق في النهاية من اتساق الأحكام.</div>
<h3>السيناريو</h3><p>أنت عضو في لجنة تخطيط حضري تضع سياسة <b>للنقل المستدام</b>. عليك الاختيار بين <b>حافلات كهربائية (BRT)</b> و<b>مترو خفيف (LRT)</b> وفق ثلاثة معايير: البيئي والاقتصادي والاجتماعي.</p>
<div class="grid"><div class="box w"><b>🎯 الهدف التعليمي</b>أن يطبّق الطالب عملية التحليل الهرمي (AHP) لاتخاذ قرار وفق المعايير البيئية والاقتصادية والاجتماعية</div><div class="box w"><b>🏁 الناتج</b>أوزان المعايير + ترتيب البدائل + فحص الاتساق</div></div>${nav(0,"ابدأ الرحلة ←")}`;
else if(step==1)h=`${tg(2)}<h2>بناء هرم القرار</h2><p>أول خطوات AHP: تفكيك المشكلة إلى مستويات: <b>الهدف</b> ← <b>المعايير (3)</b> ← <b>البدائل (2)</b>.</p>${tree}<div class="hint">الخطوة التالية: نقارن المعايير ببعضها ثنائيًا لنعرف وزن كل معيار.</div>${nav(1)}`;
else if(step==2)h=cmp('c',0,C,P3,"المقارنة الثنائية للمعايير","أيّ المعيارين أهم لسياسة النقل في مدينتك؟",`<div class="box a one"><b>ما المقارنة الثنائية (<span class="en">Pairwise Comparison</span>)؟</b> مقارنة عنصرين فقط في كل مرة وفق درجة أهمية نسبية، بدل الحكم على الجميع دفعة واحدة، مما يجعل الحكم أسهل وأدق. تُجمع النتائج في مصفوفة تُستخرج منها الأوزان.</div>${scale}`);
else if(step<=5){const k=step-3;h=cmp('a',k,A,P2,"المقارنة الثنائية للبدائل وفق المعيار "+C[k].split(":")[0],`وفق معيار «${C[k]}» أيّ البديلين أفضل؟`)}
else if(step==6){const wc=calc(S.c,3,P3),wa=S.a.map(a=>calc(a,2,P2));const sc=A.map((_,a)=>C.reduce((t,_,k)=>t+wc.w[k]*wa[k].w[a],0));const o=sc.map((s,i)=>[s,i]).sort((a,b)=>b[0]-a[0]);
h=`${tg(7)}<h2>النتيجة النهائية</h2><div class="win">🏆 البديل الأفضل: ${A[o[0][1]]} (${(o[0][0]*100).toFixed(1)}%)</div>
<h3>أوزان المعايير</h3>${C.map((c,i)=>`<div class="bar"><span>${c.split(":")[0]}</span><div class="t"><span style="width:${wc.w[i]*100}%"></span></div><b>${(wc.w[i]*100).toFixed(0)}%</b></div>`).join("")}
<h3>الترتيب النهائي للبدائل</h3>${o.map(([s,i],n)=>`<div class="bar"><span>${n+1}. ${A[i]}</span><div class="t"><span style="width:${s*100}%"></span></div><b>${(s*100).toFixed(0)}%</b></div>`).join("")}
<h3>فحص الاتساق</h3><table><tr><th>المصفوفة</th><th>λmax</th><th>CI</th><th>CR</th><th>الحكم</th></tr><tr><td>المعايير (3×3)</td><td>${wc.lam.toFixed(3)}</td><td>${wc.ci.toFixed(3)}</td><td>${wc.cr.toFixed(3)}</td><td>${wc.cr<=.1?"✔ متسق":"✘ راجع"}</td></tr><tr><td>البدائل (2×2) لكل معيار</td><td>2</td><td>0</td><td>0</td><td>✔ متسق دائمًا</td></tr></table>
<div class="cr ${wc.cr<=.1?'ok':'no'}">${wc.cr<=.1?"أحكامك على المعايير متسقة، فالنتيجة موثوقة.":"أحكامك على المعايير غير متسقة؛ لا تعتمد النتيجة قبل مراجعتها."}</div>
<div class="hint">🔬 <b>جرّب:</b> ضع أحكامًا دائرية عمدًا (البيئي أهم من الاقتصادي، والاقتصادي أهم من الاجتماعي، والاجتماعي أهم من البيئي) وراقب ارتفاع CR.</div>
<div class="btns"><button class="g" onclick="go(2)">→ عدّل المعايير</button><button onclick="S.c=[4,-4,4];go(2)">اختبر عدم الاتساق</button><button class="g" onclick="go(7)">نسبة الاتساق والمراجع ←</button></div>`}
else h=`${tg(8)}<h2>نسبة الاتساق والمعادلات والمراجع</h2>
<div class="box a one"><b>ما نسبة الاتساق (<span class="en">Consistency Ratio – CR</span>)؟</b> تقيس مدى منطقية أحكامك الثنائية. فإذا فضّلت <span class="k">(أ)</span> على <span class="k">(ب)</span>، وفضّلت <span class="k">(ب)</span> على <span class="k">(ج)</span>، فالمنطق يقتضي أن تفضّل <span class="k">(أ)</span> على <span class="k">(ج)</span> بدرجة تتسق مع الحكمين السابقين. وكلما ابتعدت أحكامك عن ذلك ارتفعت قيمة CR. تُعدّ الأحكام مقبولة عادة<span class="th">إذا&nbsp;كانت&nbsp;<bdi dir="ltr"><b>CR&nbsp;≤&nbsp;0.10</b></bdi></span></div>
<p>📖 مرجع إضافي عن الاتساق:</p><ul class="ref"><li>Wedley, W. C. (1993). Consistency prediction for incomplete AHP matrices. <i>Mathematical and Computer Modelling</i>, 17(4–5), 151–161. <a href="https://doi.org/10.1016/0895-7177(93)90183-Y" target="_blank" rel="noopener">DOI</a></li></ul>
<h3>المعادلات</h3>
<div class="f">w<sub>i</sub> = (1/n) · Σ<sub>j</sub> ( a<sub>ij</sub> / Σ<sub>k</sub> a<sub>kj</sub> )</div><div class="f">λ<sub>max</sub> = (1/n) · Σ<sub>i</sub> [ (A·w)<sub>i</sub> / w<sub>i</sub> ]</div><div class="f">CI = (λ<sub>max</sub> − n) / (n − 1)</div><div class="f">CR = CI / RI</div>
<p>الوزن: تُطبَّع أعمدة المصفوفة ثم يُؤخذ متوسط كل صف. وحيث n عدد العناصر، وA مصفوفة المقارنات الثنائية، وw متجه الأوزان، وRI المؤشر العشوائي (Random Index): 0 للمصفوفة 1×1 و2×2، و0.58 للمصفوفة 3×3، و0.90 للمصفوفة 4×4، و1.12 للمصفوفة 5×5.</p>
<h3>👤 صاحب النظرية</h3><p><b>توماس ساعاتي (Thomas Saaty، 1926–2017)</b>: عالم رياضيات أمريكي، وأستاذ في جامعة بيتسبرغ، ومبتكر عملية التحليل الهرمي.</p>
<h3>💻 برامج لتطبيق عملية التحليل الهرمي (AHP)</h3><ul class="ref">
<li>SpiceLogic: <a href="https://spicelogic.com/products/ahp-software-30" target="_blank" rel="noopener">https://spicelogic.com/products/ahp-software-30</a></li>
<li>Transparent Choice: <a href="https://www.transparentchoice.com/" target="_blank" rel="noopener">https://www.transparentchoice.com/</a></li>
<li>OnlineOutput: <a href="https://onlineoutput.com/ahp-software/" target="_blank" rel="noopener">https://onlineoutput.com/ahp-software/</a></li></ul>
<h3>📚 المراجع</h3><ul class="ref">
<li>Saaty, T. (1977). A scaling method for priorities in hierarchical structures. <i>Journal of Mathematical Psychology</i>, 15(3), 234–281. <a href="https://doi.org/10.1016/0022-2496(77)90033-5" target="_blank" rel="noopener">DOI</a></li>
<li>Ramanujam, V., &amp; Saaty, T. (1981). Technological choice in the less developed countries: An analytic hierarchy approach. <i>Technological Forecasting and Social Change</i>, 19(1), 81–98. <a href="https://doi.org/10.1016/0040-1625(81)90050-0" target="_blank" rel="noopener">DOI</a></li>
